# ────────────────────────────────────────────────────────────
# ROUTING CONFIGURATION
# ────────────────────────────────────────────────────────────

routing_config:
  confidence_weights:
    trigger_match: 0.35
    keyword_overlap: 0.25
    category_match: 0.20
    mos_alignment: 0.10
    dependency_pull: 0.10
  minimum_threshold: 0.30
  auto_fetch_enabled: true
  auto_fetch_source: "sif-kb"

# ────────────────────────────────────────────────────────────
# ACTIVATION GUIDE
# ────────────────────────────────────────────────────────────

activation_guide:
  cowork:
    method: "Skills loaded from Cowork's skills system at session start"
    custom_skills: "Upload SKILL.md files via Cowork Settings → Skills"
    note: "The .skills directory is read-only at runtime"

  claude_code:
    method: "Copy SKILL.md to your project's .claude/skills/ directory"
    steps:
      - "Clone sif-knowledge-base repo"
      - "Copy skills/[name]/SKILL.md to .claude/skills/[name]/SKILL.md"
      - "Skills auto-trigger based on description matching"

  sif_session:
    method: "Skills auto-discovered by Skill Router v4 during MGMO v3 operations"
    steps:
      - "Say 'Master Guru' to invoke MGMO v3"
      - "Skill Router v4 scans all 4 sources (filesystem + catalogue + MCP + remote)"
      - "Matching skills loaded into minion context with MOS assignments"
      - "Non-local skills auto-fetched from SIF Knowledge Base if needed"
