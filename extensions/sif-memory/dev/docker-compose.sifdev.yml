services:
  sifdev-gateway:
    image: openclaw-sifdev:local
    container_name: openclaw-sifdev
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_SKIP_CHANNELS: "1"
      OPENCLAW_SKIP_CRON: "1"
      OPENCLAW_SKIP_CANVAS_HOST: "1"
    volumes:
      - sifdev-data:/home/node/.openclaw/sif
    ports:
      - "${SIFDEV_PORT:-18789}:18789"
    init: true
    restart: unless-stopped
    mem_limit: ${SIFDEV_MEM_LIMIT:-512m}
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  sifdev-data:
    name: openclaw-sifdev-data
